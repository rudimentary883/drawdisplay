<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ draw.tournament }} | {{ draw.banner }}</title>
    <style>
        :root { --text-size: 1.15rem; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
               font-size: 1rem; line-height: 1.5; color: #212529; background: #fff; }
        .navbar { background: #343a40; color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 24px; }
        .navbar .brand { font-weight: 600; font-size: 1.15rem; color: #fff; text-decoration: none; }
        .navbar a.link { color: rgba(255,255,255,.6); text-decoration: none; font-size: .95rem; }
        .navbar a.link.active { color: #fff; }
        .banner { padding: 12px 20px; font-size: 1.1rem; font-weight: 600; background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
        .controls { display: flex; flex-wrap: wrap; gap: 14px 22px; padding: 10px 20px; border-bottom: 1px solid #dee2e6;
                    font-size: .85rem; align-items: center; position: sticky; top: 0; background: #fff; z-index: 5; }
        .controls .group { display: flex; align-items: center; gap: 6px; }
        .controls .label { color: #6c757d; }
        .btn-group { display: inline-flex; }
        .btn-group button, .tbtn { border: 1px solid #6c757d; background: #fff; color: #6c757d; padding: 3px 10px; font-size: .85rem;
                    cursor: pointer; margin-left: -1px; }
        .btn-group button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
        .btn-group button:last-child { border-radius: 0 4px 4px 0; }
        .tbtn { border-radius: 4px; margin: 0; }
        .btn-group button.on, .tbtn.on { background: #6c757d; color: #fff; }
        #status { color: #6c757d; margin-left: auto; }
        .wrap { padding: 0 20px 60px; }
        table { width: 100%; border-collapse: collapse; font-size: var(--text-size); margin-top: 14px; }
        th, td { border: 1px solid #dee2e6; padding: .5rem .75rem; vertical-align: top; }
        thead th { background: #f8f9fa; border-bottom: 2px solid #dee2e6; text-align: left; font-weight: 600; }
        tbody tr:nth-of-type(odd) { background: rgba(0,0,0,.04); }
        td.venue { font-weight: 600; white-space: nowrap; width: 1%; }
        td.team .tname { font-weight: 600; }
        td.team .spk { font-size: .8em; color: #555; line-height: 1.35; margin-top: .15rem; }
        td.adjs { white-space: normal; }
        .adjs .role { display: inline-block; font-size: .7em; font-weight: 700; color: #fff; background: #6c757d; border-radius: 3px;
                      padding: 0 4px; margin-left: 4px; vertical-align: middle; }
        .adjs .role.t { background: #adb5bd; }
        .hide-adjs .adjcol { display: none; }
        .hide-spk .spk { display: none; }
        #error { margin: 14px 20px 0; padding: 12px 16px; border-radius: 6px; background: #f8d7da; color: #721c24; display: none; }
        .empty { padding: 30px; color: #6c757d; }
    </style>
</head>
<body class="{% if not show_adjs %}hide-adjs{% endif %} {% if not show_speakers %}hide-spk{% endif %}">
    <div class="navbar">
        <a class="brand" href="/" id="tname">{{ draw.tournament }}</a>
        <a class="link active" href="#" id="rname">{{ draw.round_name }} draw</a>
        <a class="link" href="/" style="margin-left:auto;">&larr; change round / settings</a>
    </div>
    <div class="banner" id="banner">&#128079; {{ draw.banner }}</div>

    <div class="controls">
        <div class="group"><span class="label">Scroll Speed</span>
            <span class="btn-group" id="speed">
                <button data-v="6">Fast</button><button data-v="3" class="on">Medium</button><button data-v="1.5">Slow</button><button data-v="0.75">Extra Slow</button>
            </span></div>
        <div class="group"><button class="tbtn" id="adjtoggle">Hide Adjudicators</button></div>
        <div class="group"><button class="tbtn" id="spktoggle">Hide Speakers</button></div>
        <div class="group"><span class="label">Text Size</span>
            <span class="btn-group" id="size">
                <button data-v="0.8">Tiny</button><button data-v="0.95">Small</button><button data-v="1.15" class="on">Medium</button><button data-v="1.5">Large</button><button data-v="2">Huge</button>
            </span></div>
        <div class="group"><button class="tbtn on" id="stop">Stop Scroll</button></div>
        <div class="group"><button class="tbtn" id="refresh">Refresh data</button></div>
        <span id="status"></span>
    </div>
    <div id="error"></div>
    <div class="wrap"><div id="table"></div></div>

<script>
const CREDS = {{ creds|tojson }};
let DRAW = {{ draw|tojson }};
const body = document.body;
let scrolling = true, pxPerTick = 3, acc = 0, pause = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render() {
    document.getElementById('banner').innerHTML = '&#128079; ' + esc(DRAW.banner);
    document.getElementById('tname').textContent = DRAW.tournament;
    document.getElementById('rname').textContent = DRAW.round_name + ' draw';
    document.title = DRAW.tournament + ' | ' + DRAW.banner;
    if (!DRAW.rows.length) { document.getElementById('table').innerHTML = '<div class="empty">No debates in this draw yet.</div>'; return; }
    let h = '<table><thead><tr><th>Venue</th>';
    DRAW.positions.forEach(p => h += '<th>' + esc(p) + '</th>');
    h += '<th class="adjcol">Adjudicators</th></tr></thead><tbody>';
    DRAW.rows.forEach(r => {
        h += '<tr><td class="venue">' + esc(r.venue) + '</td>';
        r.teams.forEach(t => {
            h += '<td class="team"><div class="tname">' + (t.emoji ? esc(t.emoji) + ' ' : '') + esc(t.name) + '</div>';
            if (t.speakers.length) h += '<div class="spk">' + t.speakers.map(esc).join('<br>') + '</div>';
            h += '</td>';
        });
        const adjs = [];
        if (r.chair) adjs.push(esc(r.chair) + '<span class="role">C</span>');
        r.panellists.forEach(n => adjs.push(esc(n)));
        r.trainees.forEach(n => adjs.push(esc(n) + '<span class="role t">T</span>'));
        h += '<td class="adjs adjcol">' + adjs.join('<br>') + '</td></tr>';
    });
    document.getElementById('table').innerHTML = h + '</tbody></table>';
}

function pick(groupId, cb) {
    document.querySelectorAll('#' + groupId + ' button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#' + groupId + ' button').forEach(x => x.classList.remove('on'));
        b.classList.add('on'); cb(parseFloat(b.dataset.v));
    }));
}
pick('speed', v => { pxPerTick = v; scrolling = true; document.getElementById('stop').classList.add('on'); document.getElementById('stop').textContent = 'Stop Scroll'; });
pick('size', v => document.documentElement.style.setProperty('--text-size', v + 'rem'));

const adjBtn = document.getElementById('adjtoggle'), spkBtn = document.getElementById('spktoggle');
function syncButtons() {
    adjBtn.textContent = body.classList.contains('hide-adjs') ? 'Show Adjudicators' : 'Hide Adjudicators';
    spkBtn.textContent = body.classList.contains('hide-spk') ? 'Show Speakers' : 'Hide Speakers';
}
adjBtn.onclick = () => { body.classList.toggle('hide-adjs'); syncButtons(); };
spkBtn.onclick = () => { body.classList.toggle('hide-spk'); syncButtons(); };
const stopBtn = document.getElementById('stop');
stopBtn.onclick = () => {
    scrolling = !scrolling;
    stopBtn.textContent = scrolling ? 'Stop Scroll' : 'Start Scroll';
    stopBtn.classList.toggle('on', scrolling);
};

// slow automatic scrolling to the bottom, a short pause, then back to the top
setInterval(() => {
    if (!scrolling) return;
    if (pause > 0) { pause--; return; }
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 5) return;
    if (window.scrollY >= max - 2) { pause = 60; window.scrollTo(0, 0); return; }
    acc += pxPerTick;
    if (acc >= 1) { window.scrollBy(0, Math.floor(acc)); acc -= Math.floor(acc); }
}, 50);

async function refresh() {
    const status = document.getElementById('status'), err = document.getElementById('error');
    status.textContent = 'Refreshing...';
    try {
        const resp = await fetch('/data', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(CREDS)});
        const data = await resp.json();
        if (data.ok) { DRAW = data.draw; render(); err.style.display = 'none'; status.textContent = 'Updated ' + new Date().toLocaleTimeString(); }
        else { err.textContent = data.error; err.style.display = 'block'; status.textContent = ''; }
    } catch (e) { err.textContent = 'Network error: ' + e.message; err.style.display = 'block'; status.textContent = ''; }
}
document.getElementById('refresh').onclick = refresh;
syncButtons(); render();
document.getElementById('status').textContent = 'Loaded ' + new Date().toLocaleTimeString();
</script>
</body>
</html>
