<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ draw.tournament }} | Draw for {{ draw.round_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3f2fa0; --muted: #6c757d; --line: #dee2e6; --table-size: 1.1rem; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 1rem;
               line-height: 1.5; color: #212529; background: #fff; }
        /* ---- navbar ---- */
        .navbar { display: flex; align-items: center; gap: 4px; padding: 0 20px; height: 65px; border-bottom: 1px solid #e5e5e5; background: #fff; }
        .navbar .item { position: relative; }
        .navbar .nav, .navbar a.nav { display: inline-flex; align-items: center; gap: 6px; padding: 8px 9px; color: #7d838a; text-decoration: none;
               font-size: 1.12rem; background: none; border: 0; cursor: pointer; font-family: inherit; }
        .navbar .nav.dark { color: #212529; }
        .navbar a.nav.brand { color: #212529; }
        .navbar .brand { display: inline-flex; align-items: center; gap: 10px; color: #212529; padding: 8px 9px; font-size: 1.18rem; }
        .caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; }
        .menu { display: none; position: absolute; top: 100%; left: 0; min-width: 170px; background: #fff; border: 1px solid rgba(0,0,0,.15);
                border-radius: 4px; padding: 6px 0; z-index: 30; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .menu a { display: block; padding: 6px 18px; color: #212529; text-decoration: none; font-size: 1rem; white-space: nowrap; }
        .menu a:hover { background: #f1f1f1; }
        .item.open .menu { display: block; }
        /* ---- heading ---- */
        .page { padding: 0 17px 50px; }
        h1 { font-size: 2.25rem; font-weight: 700; margin: 22px 0 18px 24px; line-height: 1.2; display: flex; align-items: center; }
        h1 .emoji { font-size: 2.1rem; margin-right: 18px; font-weight: 400; }
        h1 small { font-size: 80%; font-weight: 400; color: var(--muted); margin-left: .6rem; }
        /* ---- control buttons ---- */
        .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
        .controls .left { justify-self: start; } .controls .right { justify-self: end; } .controls .mid { display: flex; gap: 10px; }
        .btn-group { display: inline-flex; }
        .btn-group > * { margin-left: -1px; }
        .btn-group > *:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
        .btn-group > *:last-child { border-radius: 0 4px 4px 0; }
        .cbtn { font-family: inherit; font-size: 1.1rem; padding: .55rem .95rem; line-height: 1.5; border: 1px solid var(--accent); color: var(--accent);
                background: #fff; cursor: pointer; border-radius: 4px; }
        .cbtn:hover, .cbtn.on { background: var(--accent); color: #fff; }
        .cbtn.label { border-color: #ced4da; color: #7d838a; cursor: default; background: #fff; }
        .cbtn.label:hover { background: #fff; color: #7d838a; }
        #stop { display: none; }
        /* ---- find in table ---- */
        .find { display: flex; gap: 10px; margin: 28px 0 18px; }
        .find .box { display: flex; flex: 1; }
        .find input { flex: 1; font-family: inherit; font-size: 1.1rem; padding: .6rem 1.4rem; border: 1px solid #ced4da; border-right: 0; border-radius: 4px 0 0 4px; outline: none; }
        .find input::placeholder { color: #7d838a; }
        .find .go, .find .copy { background: #e9ecef; border: 1px solid #ced4da; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #495057; }
        .find .go { width: 47px; border-radius: 0 4px 4px 0; }
        .find .copy { width: 47px; border-radius: 4px; background: #e2e5e8; }
        /* ---- table ---- */
        .card { border: 1px solid #e3e5e8; border-radius: 4px; padding: 6px 12px 4px; }
        table { width: 100%; border-collapse: collapse; font-size: var(--table-size); }
        th { text-align: left; font-weight: 400; padding: .72rem .75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
        td { padding: .5rem .75rem; border-bottom: 1px solid #e9ecef; vertical-align: top; }
        tbody tr:last-child td { border-bottom: 0; }
        td.venue { white-space: nowrap; }
        .lnk { text-decoration: underline; text-decoration-color: #c9ced3; text-decoration-thickness: 1px; text-underline-offset: 4px; }
        .emo { display: inline-block; margin-right: .3em; }
        .spk { font-size: .82em; line-height: 1.35; color: #6c757d; margin-top: .1rem; }
        .rl { display: inline-block; width: 1.05em; height: 1.05em; border: 1.4px solid currentColor; border-radius: 50%; font-size: .78em; line-height: .98em;
              text-align: center; font-weight: 600; margin-left: .12em; vertical-align: .05em; }
        .hide-adjs .adjcol { display: none; }
        .sort { background: none; border: 0; cursor: pointer; padding: 0; color: #212529; display: inline-flex; align-items: center; }
        #msg { display: none; margin: 14px 0; padding: 12px 16px; border-radius: 4px; background: #fff3cd; color: #664d03; }
        .empty { padding: 26px 12px; color: var(--muted); }
        @media (max-width: 760px) { .controls { grid-template-columns: 1fr; } .controls .left, .controls .right { justify-self: start; } h1 { font-size: 1.7rem; margin-left: 4px; } }
    </style>
</head>
<body>
    <nav class="navbar" id="nav">
        <div class="item">
            <a class="nav brand" href="#" data-menu><svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4df0"/><stop offset="1" stop-color="#3f2fa0"/></linearGradient></defs><circle cx="18" cy="18" r="17" fill="url(#g)"/><path d="M18.4 6.5c3.4 4.2 6.8 7 6.8 12 0 3.9-3 6.8-7 6.8s-7-2.9-7-6.8c0-2.4 1.1-4 2.4-5.7.2 2.3 1.5 3.4 2.6 3.4-.1-4.4-1-6.7 2.2-9.7z" fill="#fff"/></svg><span id="tname">{{ draw.tournament }}</span><span class="caret"></span></a>
            <div class="menu"><a href="{{ site }}/">Tournament home</a></div>
        </div>
        <div class="item" id="drawsmenu"><a class="nav dark" href="#" data-menu>Draws <span class="caret"></span></a><div class="menu" id="drawslist"></div></div>
        <div class="item"><a class="nav" href="#" data-menu>Results <span class="caret"></span></a><div class="menu" id="resultslist"></div></div>
        <a class="nav" href="{{ site }}/motions/">Motions</a>
        <a class="nav" href="{{ site }}/tab/current-standings/">Standings</a>
        <a class="nav" href="{{ site }}/participants/list/">Participants</a>
        <a class="nav" href="{{ site }}/feedback/progress/">Feedback Progress</a>
    </nav>

    <div class="page" id="page">
        <h1><span class="emoji">&#128079;</span><span><span id="title">Draw for {{ draw.round_name }}</span><small id="start"></small></span></h1>

        <div class="controls">
            <div class="left"><span class="btn-group" id="speed"><span class="cbtn label">Scroll Speed</span>
                <button class="cbtn" data-v="6">Fast</button><button class="cbtn" data-v="3">Medium</button><button class="cbtn" data-v="1.5">Slow</button><button class="cbtn" data-v="0.75">Extra Slow</button></span></div>
            <div class="mid"><button class="cbtn" id="adjtoggle">Hide Adjudicators</button><button class="cbtn" id="stop">Stop Scroll</button></div>
            <div class="right"><span class="btn-group" id="size"><span class="cbtn label">Text Size</span>
                <button class="cbtn" data-v="0.7">Tiny</button><button class="cbtn" data-v="0.9">Small</button><button class="cbtn" data-v="1.1">Medium</button><button class="cbtn" data-v="1.5">Large</button><button class="cbtn" data-v="2">Huge</button></span></div>
        </div>

        <div class="find">
            <div class="box"><input type="text" id="find" placeholder="Find in Table" autocomplete="off">
                <button class="go" id="go" title="Search" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
            <button class="copy" id="copy" title="Copy table" aria-label="Copy table"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#212529" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/></svg></button>
        </div>
        <div id="msg"></div>
        <div class="card"><div id="table"></div></div>
    </div>

<script>
const QS = {{ qs|tojson }};
const SITE = {{ site|tojson }};
let DRAW = {{ draw|tojson }};
let sortAsc = true, scrolling = false, pxPerTick = 3, acc = 0, pause = 0;
const body = document.body;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rowText(r) {
    return [r.venue].concat(r.teams.map(t => t.name + ' ' + t.speakers.join(' ')), [r.chair], r.panellists, r.trainees).join(' ').toLowerCase();
}
function render() {
    document.title = DRAW.tournament + ' | Draw for ' + DRAW.round_name;
    document.getElementById('tname').textContent = DRAW.tournament;
    document.getElementById('title').textContent = 'Draw for ' + DRAW.round_name;
    document.getElementById('start').textContent = DRAW.start ? 'debates start at ' + DRAW.start : '';
    document.getElementById('drawslist').innerHTML = DRAW.draw_rounds.map(r => '<a href="/round/' + r.seq + QS + '">' + esc(r.name) + '</a>').join('') || '<a>No Draws Available</a>';
    document.getElementById('resultslist').innerHTML = DRAW.all_rounds.map(r => '<a href="' + SITE + '/results/round/' + r.seq + '/">' + esc(r.name) + '</a>').join('');
    const q = document.getElementById('find').value.trim().toLowerCase();
    const rows = DRAW.rows.slice().sort((a, b) => (sortAsc ? 1 : -1) * a.venue.localeCompare(b.venue, undefined, {numeric: true, sensitivity: 'base'}))
        .filter(r => !q || rowText(r).includes(q));
    const arrow = sortAsc ? 'M7 14l5-5 5 5' : 'M7 10l5 5 5-5';
    let h = '<table><thead><tr><th><button class="sort" id="sortv" title="Sort by venue" aria-label="Sort by venue"><svg width="30" height="20" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="9" cy="10" r="2"/><path d="' + arrow + '" transform="translate(9 0) scale(.9)"/></svg></button></th>';
    DRAW.positions.forEach(p => h += '<th>' + esc(p) + '</th>');
    h += '<th class="adjcol">Adjudicators</th></tr></thead><tbody>';
    rows.forEach(r => {
        h += '<tr><td class="venue">' + esc(r.venue) + '</td>';
        r.teams.forEach(t => {
            h += '<td><div><span class="lnk">' + (t.emoji ? '<span class="emo">' + esc(t.emoji) + '</span>' : '') + esc(t.name) + '</span></div>';
            if (t.speakers.length) h += '<div class="spk">' + t.speakers.map(esc).join('<br>') + '</div>';
            h += '</td>';
        });
        const adjs = [];
        if (r.chair) adjs.push('<span class="lnk">' + esc(r.chair) + '</span><span class="rl">C</span>');
        r.panellists.forEach(n => adjs.push('<span class="lnk">' + esc(n) + '</span>'));
        r.trainees.forEach(n => adjs.push('<span class="lnk">' + esc(n) + '</span><span class="rl">T</span>'));
        h += '<td class="adjcol">' + adjs.join(', ') + '</td></tr>';
    });
    h += '</tbody></table>';
    if (!rows.length) h = '<div class="empty">' + (DRAW.rows.length ? 'No matching debates.' : 'No debates in this draw yet.') + '</div>';
    document.getElementById('table').innerHTML = h;
    const sv = document.getElementById('sortv'); if (sv) sv.onclick = () => { sortAsc = !sortAsc; render(); };
    const msg = document.getElementById('msg');
    if (DRAW.adjs_hidden) { msg.textContent = 'The adjudicator names are not available from the tab site (an API token is needed).'; msg.style.display = 'block'; }
}

function pick(groupId, cb) {
    document.querySelectorAll('#' + groupId + ' button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#' + groupId + ' button').forEach(x => x.classList.remove('on'));
        b.classList.add('on'); cb(parseFloat(b.dataset.v));
    }));
}
const stopBtn = document.getElementById('stop');
pick('speed', v => { pxPerTick = v; scrolling = true; stopBtn.style.display = 'inline-block'; });
pick('size', v => document.documentElement.style.setProperty('--table-size', v + 'rem'));
stopBtn.onclick = () => { scrolling = false; stopBtn.style.display = 'none'; document.querySelectorAll('#speed button').forEach(x => x.classList.remove('on')); };
const adjBtn = document.getElementById('adjtoggle');
adjBtn.onclick = () => { body.classList.toggle('hide-adjs'); adjBtn.textContent = body.classList.contains('hide-adjs') ? 'Show Adjudicators' : 'Hide Adjudicators'; };
document.getElementById('find').addEventListener('input', render);
document.getElementById('go').onclick = () => document.getElementById('find').focus();
document.getElementById('copy').onclick = () => {
    const lines = [['Venue'].concat(DRAW.positions, ['Adjudicators']).join('\t')];
    DRAW.rows.slice().sort((a, b) => a.venue.localeCompare(b.venue, undefined, {numeric: true})).forEach(r => lines.push([r.venue]
        .concat(r.teams.map(t => t.name + (t.speakers.length ? ' (' + t.speakers.join(', ') + ')' : '')),
                [[r.chair ? r.chair + ' (C)' : ''].concat(r.panellists, r.trainees.map(n => n + ' (T)')).filter(Boolean).join(', ')]).join('\t')));
    if (navigator.clipboard) navigator.clipboard.writeText(lines.join('\n'));
};
document.querySelectorAll('[data-menu]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); const item = a.parentElement, was = item.classList.contains('open');
    document.querySelectorAll('.item.open').forEach(i => i.classList.remove('open')); if (!was) item.classList.add('open');
}));
document.addEventListener('click', e => { if (!e.target.closest('.item')) document.querySelectorAll('.item.open').forEach(i => i.classList.remove('open')); });

// slow automatic scrolling to the bottom, a short pause, then back to the top
setInterval(() => {
    if (!scrolling) return;
    if (pause > 0) { pause--; return; }
    const max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 5) return;
    if (window.scrollY >= max - 2) { pause = 60; window.scrollTo(0, 0); return; }
    acc += pxPerTick;
    if (acc >= 1) { window.scrollBy(0, Math.floor(acc)); acc -= Math.floor(acc); }
}, 50);

// the draw refreshes by itself every minute
setInterval(async () => {
    try {
        const resp = await fetch('/data/' + DRAW.round_seq + QS); const data = await resp.json();
        if (data.ok) { DRAW = data.draw; render(); }
    } catch (e) {}
}, 60000);
render();
</script>
</body>
</html>
